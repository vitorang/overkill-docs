<mat-toolbar color="primary" class="main-toolbar">
    <div class="align-left">
        <button mat-button (click)="goToHome()">
            <okd-brand [compact]="true" />
        </button>
        <ng-template [cdkPortalOutlet]="portal()?.left" />
    </div>

    <div class="align-center">
        <ng-template [cdkPortalOutlet]="portal()?.center" />
    </div>

    <div class="align-right">
        <ng-template [cdkPortalOutlet]="portal()?.right" />
        <button mat-icon-button [matMenuTriggerFor]="profileMenu">
            <mat-icon>more_vert</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-menu #profileMenu="matMenu">
    <button mat-menu-item (click)="goToSettings()">
        <mat-icon>person</mat-icon>
        <span>Minha Conta</span>
    </button>
    <button mat-menu-item (click)="toggleDebugMode()">
        @if (debugModeEnabled()) {
            <mat-icon>check</mat-icon>
        } @else {
            <mat-icon>bug_report</mat-icon>
        }
        <span>Modo Debug</span>
    </button>
    <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Sair</span>
    </button>
</mat-menu>
