@if (showPlaceholder()) {
    <okd-article-placeholder-fragment [type]="fragment().type" />
} @else {
    <iframe
        [src]="url()"
        [class.vertical]="isVertical()"
        frameborder="0"
        allow="picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
    ></iframe>
}
