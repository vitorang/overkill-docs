@if (isEditing()) {
    <mat-card>
        <mat-card-header>
            <h2>Alterar vídeo</h2>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field appearance="outline">
                <mat-label>Endereço</mat-label>
                <input matInput [(ngModel)]="urlModel" />
            </mat-form-field>
        </mat-card-content>
    </mat-card>
} @else if (showPlaceholder()) {
    <okd-article-placeholder-fragment [type]="fragment().type" />
} @else {
    <iframe
        [src]="current().url"
        [class.vertical]="current().isVertical"
        frameborder="0"
        allow="picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
    ></iframe>
}

<ng-template #toolbarContent>
    <button mat-mini-fab (click)="saveAndFinishEdit()" title="Concluir edição">
        <mat-icon>check</mat-icon>
    </button>
</ng-template>
