<mat-toolbar>
    <div class="toolbar-content max-width">
        <div class="title">{{ document().title }}</div>

        @if (editMode()) {
            <button mat-icon-button (click)="editMode.set(false)">
                <mat-icon>edit_off</mat-icon>
            </button>
        } @else {
            <button mat-icon-button (click)="editMode.set(true)">
                <mat-icon>edit</mat-icon>
            </button>
        }

        <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-menu #menu="matMenu" xPosition="before">
    <button mat-menu-item>
        <mat-icon>edit</mat-icon>
        <span>Renomear</span>
    </button>

    <button mat-menu-item>
        <mat-icon color="warn">delete</mat-icon>
        <span>Excluir</span>
    </button>
</mat-menu>

<div class="main-content">
    <article class="max-width">
        @if (editMode()) {
            <okd-article-add-fragment [insertAfter]="null" />
        }

        @for (fragment of document().fragments; track fragment.hashId) {
            @switch (fragment.type) {
                @case (FragmentType.Markdown) {
                    <okd-article-markdown-fragment [fragment]="fragment" />
                }
                @case (FragmentType.Image) {
                    <okd-article-image-fragment [fragment]="fragment" />
                }
                @case (FragmentType.Embed) {
                    <okd-article-embed-fragment [fragment]="fragment" />
                }
            }

            @if (editMode()) {
                <okd-article-add-fragment [insertAfter]="null" />
            }
        }
    </article>
</div>
