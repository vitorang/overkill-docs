@if (isEditing()) {
    <mat-card>
        <mat-card-header>
            <h2>Alterar imagem</h2>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field appearance="outline">
                <mat-label>Endereço</mat-label>
                <input matInput [(ngModel)]="urlModel" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Descrição</mat-label>
                <input matInput [(ngModel)]="altModel" />
            </mat-form-field>
        </mat-card-content>
    </mat-card>
} @else if (showPlaceholder()) {
    <okd-article-placeholder-fragment [type]="fragment().type" />
} @else {
    <img [src]="current().url" [alt]="current().alt" />
}

<ng-template #toolbarContent>
    <button mat-mini-fab (click)="saveAndFinishEdit()" title="Concluir edição">
        <mat-icon>check</mat-icon>
    </button>
</ng-template>
