<div class="content">
    @if (showAvatar()) {
        <okd-avatar
            [avatarCode]="user().avatar"
            [seed]="user().hashId"
            [size]="24"
            sizeUnit="px"
            [title]="user().name"
        />
    }

    @if (showActions()) {
        <button
            mat-icon-button
            [matMenuTriggerFor]="editFragment"
            title="Modificar"
            [disabled]="disabled()"
        >
            <mat-icon>more_vert</mat-icon>
        </button>
    }
</div>

<mat-menu #editFragment="matMenu">
    <button mat-menu-item (click)="edit.emit()">
        <mat-icon>edit_note</mat-icon>
        <span>Editar</span>
    </button>

    <button mat-menu-item (click)="delete.emit()">
        <mat-icon>remove</mat-icon>
        <span>Remover</span>
    </button>
</mat-menu>
