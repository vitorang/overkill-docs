@if (isMobile()) {
    <button
        mat-icon-button
        (click)="toggleSection()"
        matBadge="&ZeroWidthSpace;"
        [matBadgeHidden]="!hasUnreadMessage()"
        data-testid="toggle-chat-button"
        [attr.data-value]="activeSection()"
    >
        <mat-icon>{{
            activeSection() === 'editor' ? 'chat_bubble_outline' : 'edit_note'
        }}</mat-icon>
    </button>
}
