<okd-reconnection-overlay>
    <div class="layout">
        <okd-main-header />

        <div class="main-content">
            @if (debugModeEnabled()) {
                <section class="hub-monitor hidden-mobile">
                    <okd-hub-monitor />
                </section>
            }

            <section class="editor" [class.hidden-mobile]="!displayEditor()">
                <router-outlet />
            </section>

            <section class="chat" [class.hidden-mobile]="!displayChat()">
                <okd-chat-view />
            </section>
        </div>
        <div></div>
    </div>
</okd-reconnection-overlay>
